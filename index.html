<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Commute Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased p-4 pb-12">

    <script>
        // --- CONFIGURATION ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyevrcmR88aEx0RfXa2tO8AL6t0DV4MbVlFA-QWyMwG80YN4V7yam4dQgYlLQidgcXV/exec"; 
        // ---------------------

        let sheetData = [];

        async function fetchCommuteData() {
            document.getElementById('loading').classList.remove('hidden');
            try {
                const response = await fetch(WEB_APP_URL);
                sheetData = await response.json();
                processDashboardData();
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('loading').innerText = "Error loading data. Check URL and Apps Script permissions.";
            }
        }

        // Helper to convert "09:09" or "08:36:00" to total minutes for math
        function timeToMinutes(timeVal) {
            if (!timeVal) return null;
            let str = String(timeVal);
            if (str.includes('T')) { // Handles raw date objects from sheets
                let d = new Date(str);
                return d.getHours() * 60 + d.getMinutes();
            }
            let parts = str.split(':');
            if (parts.length >= 2) {
                return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            }
            return null;
        }

        // Helper to format date strings like "12/09/2026"
        function formatDateLabel(dateVal) {
            if (!dateVal) return "";
            let str = String(dateVal);
            let d = str.includes('/') ? new Date(str.split('/')[2], str.split('/')[1] - 1, str.split('/')[0]) : new Date(str);
            return d.toLocaleDateString([], {weekday: 'short'});
        }

        function processDashboardData() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            let timelineHTML = "";
            let chartLabels = [];
            let morningData = [];
            let eveningData = [];
            let morningCommute = 0;
            let eveningCommute = 0;
            
            // Filter out fully empty rows and grab the last 7 days
            const validData = sheetData.filter(row => row.Date && row.Date.trim() !== "");
            const recentData = validData.slice(-7);
            
            // Build Chart Data
            recentData.forEach(row => {
                chartLabels.push(formatDateLabel(row.Date));

                let mCommute = 0;
                let eCommute = 0;

                let tLeaveHome = timeToMinutes(row['Leave Home']);
                let tArriveOffice = timeToMinutes(row['Arrive Office']);
                let tLeaveOffice = timeToMinutes(row['Leave Office']);
                let tArriveHome = timeToMinutes(row['Arrive Home']);

                if (tLeaveHome !== null && tArriveOffice !== null) mCommute = tArriveOffice - tLeaveHome;
                if (tLeaveOffice !== null && tArriveHome !== null) eCommute = tArriveHome - tLeaveOffice;

                morningData.push(mCommute > 0 ? mCommute : 0);
                eveningData.push(eCommute > 0 ? eCommute : 0);
            });

            // Build Today's Data (using the absolute last row in the sheet)
            const todayRow = validData[validData.length - 1];

            if (todayRow) {
                let tLeaveHome = timeToMinutes(todayRow['Leave Home']);
                let tArriveOffice = timeToMinutes(todayRow['Arrive Office']);
                let tLeaveOffice = timeToMinutes(todayRow['Leave Office']);
                let tArriveHome = timeToMinutes(todayRow['Arrive Home']);

                if (tLeaveHome !== null && tArriveOffice !== null) morningCommute = tArriveOffice - tLeaveHome;
                if (tLeaveOffice !== null && tArriveHome !== null) eveningCommute = tArriveHome - tLeaveOffice;

                // Update Stats Cards
                document.getElementById('morning-time').innerText = morningCommute > 0 ? morningCommute + " min" : "--";
                document.getElementById('evening-time').innerText = eveningCommute > 0 ? eveningCommute + " min" : "--";
                document.getElementById('office-time').innerText = todayRow['Office Hours'] || "--";
                document.getElementById('status-text').innerText = todayRow['Status'] || "In Progress";

                // Build Timeline
                function createTimelineItem(iconClass, time, text) {
                    if (!time) return "";
                    // format time to strip seconds if they exist (e.g., 08:36:00 -> 08:36)
                    let displayTime = String(time).split(':').slice(0,2).join(':');
                    if (String(time).includes('T')) displayTime = new Date(time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    return `
                        <div class="flex items-center mb-4">
                            <div class="bg-white p-3 rounded-full shadow-sm mr-4 w-12 h-12 flex items-center justify-center"><i class="fa-solid ${iconClass} text-xl"></i></div>
                            <div>
                                <p class="text-sm text-slate-500">${displayTime}</p>
                                <p class="font-bold">${text}</p>
                            </div>
                        </div>
                    `;
                }

                if (todayRow['Leave Home']) timelineHTML += createTimelineItem("fa-house-person-leave text-blue-500", todayRow['Leave Home'], "Left Home");
                if (todayRow['Arrive Office']) timelineHTML += createTimelineItem("fa-building text-green-500", todayRow['Arrive Office'], "Arrived at Office");
                if (todayRow['Leave Office']) timelineHTML += createTimelineItem("fa-building-user text-orange-500", todayRow['Leave Office'], "Left Office");
                if (todayRow['Arrive Home']) timelineHTML += createTimelineItem("fa-house text-purple-500", todayRow['Arrive Home'], "Arrived Home");
                
                document.getElementById('timeline').innerHTML = timelineHTML || "<p class='text-slate-500'>No activity logged yet today.</p>";
            }

            // Render Chart
            const ctx = document.getElementById('commuteChart').getContext('2d');
            
            // Destroy existing chart if refreshing
            if(window.commuteChartObj) window.commuteChartObj.destroy();

            window.commuteChartObj = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [
                        { label: 'Morning (min)', data: morningData, backgroundColor: '#3b82f6', borderRadius: 4 },
                        { label: 'Evening (min)', data: eveningData, backgroundColor: '#8b5cf6', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: true, grid: { display: false } } }
                }
            });
        }

        window.onload = fetchCommuteData;
    </script>

    <!-- UI Layout -->
    <div class="max-w-md mx-auto">
        <header class="mb-6 mt-4">
            <h1 class="text-2xl font-extrabold text-slate-800">Commute Tracker</h1>
            <p class="text-slate-500" id="current-date"></p>
            <script>document.getElementById('current-date').innerText = new Date().toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'});</script>
        </header>

        <div id="loading" class="text-center py-10 text-blue-500 font-bold animate-pulse">
            Fetching data from Google Sheets...
        </div>

        <div id="dashboard" class="hidden space-y-6">
            
            <!-- Quick Stats -->
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-card p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">To Office</p>
                    <p class="text-2xl font-extrabold text-blue-600" id="morning-time">--</p>
                </div>
                <div class="glass-card p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">To Home</p>
                    <p class="text-2xl font-extrabold text-purple-600" id="evening-time">--</p>
                </div>
                <div class="glass-card p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center col-span-2">
                    <div>
                        <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Total Time at Office</p>
                        <p class="text-2xl font-extrabold text-slate-700" id="office-time">--</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Status</p>
                        <p class="text-sm font-bold text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full" id="status-text">--</p>
                    </div>
                </div>
            </div>

            <!-- Today's Timeline -->
            <div class="glass-card p-5 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="font-bold text-lg mb-4">Latest Logs</h2>
                <div id="timeline" class="border-l-2 border-slate-200 ml-4 pl-4">
                    <!-- Timeline items injected via JS -->
                </div>
            </div>

            <!-- Chart -->
            <div class="glass-card p-5 rounded-2xl shadow-sm border border-slate-100 h-64">
                <h2 class="font-bold text-lg mb-2">Recent Commutes</h2>
                <canvas id="commuteChart"></canvas>
            </div>
            
            <button onclick="fetchCommuteData()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl shadow-md active:bg-slate-700 transition-colors">
                Refresh Data
            </button>
        </div>
    </div>
</body>
</html>
